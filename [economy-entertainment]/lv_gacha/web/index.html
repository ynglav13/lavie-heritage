<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Case Opening</title></head><body><main id="app" class="hidden"><header><div class="brand"><img id="logo"><div><small>LOS SANTOS LEGACY</small><strong>Case Opening</strong></div></div><button id="close" aria-label="Đóng">×</button></header><div class="workspace"><aside><label>BỘ SƯU TẬP</label><nav id="cases"></nav></aside><section><div class="case-head"><div><small>HÒM ĐANG CHỌN</small><h1 id="caseName"></h1><p id="desc"></p></div><div class="stock"><div><span>Hòm sở hữu</span><b id="boxes">0</b></div><div><span>Chìa khóa</span><b id="keys">0 / 1</b></div></div></div><div class="spin-wrap"><div id="roulette"><div class="fade l"></div><div class="fade r"></div><div class="marker"></div><div id="reel"></div></div><button id="skip" class="hidden">Bỏ qua</button></div><div class="controls"><div class="pity"><div><span id="pityText"></span><span id="pityNumber"></span></div><i><b id="pityBar"></b></i></div><button id="open"><strong>MỞ HÒM</strong><small id="costText"></small></button></div><div class="loot-title"><span>VẬT PHẨM TRONG HÒM <b id="lootCount"></b></span><span>TỶ LỆ</span></div><div id="rewards"></div></section></div><div id="win" class="hidden"><div class="win-card"><small>BẠN ĐÃ NHẬN ĐƯỢC</small><div id="winVisual"></div><h2 id="winName"></h2><p id="winMeta"></p><button id="again">TIẾP TỤC</button></div></div></main><script src="app.js"></script></body></html>
