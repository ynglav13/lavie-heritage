<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Faction Panel</title>

    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- jQuery must load FIRST -->
    <script src="JS/jquery.min.js"></script>

    <!-- Scripts -->
    <script src="JS/app.js"></script>
    <script src="JS/general.js"></script>
    <script src="JS/members.js"></script>
    <script src="JS/rank.js"></script>
    <script src="JS/division.js"></script>
    <script src="JS/permission.js"></script>
    <script src="JS/select.js"></script>
    <script src="JS/bizSelect.js"></script>
    <script src="JS/bizEdit.js"></script>
    <script src="JS/garage.js"></script>
    <script src="JS/garageVehicles.js"></script>
    <script src="JS/locker.js"></script>
    <script src="JS/armory.js"></script>
    <script src="JS/garageSpawn.js"></script>
</head>

<body>
    <div class="container">
        <div class="panel-wrapper">
            <div class="overlap-icon"><i class="fa-solid fa-users-gear"></i></div>
            <div class="header"></div>
            <div class="panel-body">
                <div class="listmenu"></div>
                <div class="main-bg">
                    <div class="search-container" style="display: none;">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search" placeholder="Search vehicle model...">
                    </div>
                    <div class="content"></div>
                </div>
            </div>
            <div class="footer"></div>
        </div>
    </div>
</body>

</html>
